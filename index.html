<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookHelp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <header>
        <nav class="navbar" style="background-color: #224499;">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-end" href="./index.html" style="color: white; text-decoration: none;">
                    <img src="./images/bookeeplogo.png" alt="Bookeep Logo" width="42" height="52" class="d-inline-block">
                    <h1 class="mb-0 ms-2">ookCenter</h1>
                </a>
                <div class="d-flex gap-2">
                    <button class="btn btn-success" onclick="window.location.href='F:\\Bookeep_HTML\\index.html'">
                        Try Bookeep
                    </button>
                </div>
            </div>
        </nav>
    </header>
    
    <article class="container mt-4">
        <h1 style="text-align: center; margin-bottom: 0; padding-top: 5px">BookHelp</h1>
    </article>

    <div id="timerPanel" class="timer-panel hidden">
        <button id="toggleBtn" class="toggle-btn" onclick="togglePanel()">
            <span id="arrow">◀</span>
        </button>
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex flex-column align-items-center" style="gap: 20px;">
                    <div id="app"></div>
                    <button id="startButton" onclick="startTimer()" class="btn btn-success">Start Timer</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-1">Thanks to <a style="color:aqua" href="https://css-tricks.com/how-to-create-an-animated-countdown-timer-with-html-css-and-javascript/">Mateusz Rybczonek</a> for guide on timer</p>
            <p class="mb-0">&copy; 2025 Do Not Steal My Work Inc. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./backend.js"></script>
</body>
</html>
